name: Deploy (staging)

# Builds the image, pushes to Artifact Registry, runs migrations as a one-shot
# Cloud Run Job with Cloud SQL proxy, then deploys the api + worker Cloud Run
# services. Requires GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_DEPLOY_SERVICE_ACCOUNT
# secrets to be set in the repo.
#
# Cloud SQL connection: Cloud Run services use the built-in Cloud SQL Auth Proxy
# (unix socket via --set-cloudsql-instances). Both DATABASE_URL and DIRECT_URL
# point to the socket secret (akabbo-database-url).

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: prime-principle-456608-p7
  GCP_REGION: europe-west1
  CLOUD_RUN_SA: akabbo-cloudrun@prime-principle-456608-p7.iam.gserviceaccount.com
  SQL_INSTANCE: prime-principle-456608-p7:europe-west1:akabbo-staging

jobs:
  deploy:
    name: Build · Migrate · Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="europe-west1-docker.pkg.dev/${GCP_PROJECT_ID}/akabbo/akabbo:${{ github.sha }}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Run database migrations (one-shot Cloud Run Job)
        # The migration job runs on Cloud Run with the Cloud SQL Auth Proxy attached
        # (--set-cloudsql-instances). Both DATABASE_URL and DIRECT_URL use the socket
        # URL (akabbo-database-url) — the raw public IP is not reachable from Cloud Run
        # without authorized networks. The socket path is the correct connection method.
        run: |
          gcloud run jobs deploy akabbo-migrate \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --service-account "$CLOUD_RUN_SA" \
            --set-cloudsql-instances "$SQL_INSTANCE" \
            --command node \
            --args "node_modules/prisma/build/index.js,migrate,deploy" \
            --set-secrets "DATABASE_URL=akabbo-database-url:latest,DIRECT_URL=akabbo-database-url:latest" \
            --max-retries 1 --quiet
          gcloud run jobs execute akabbo-migrate --region "$GCP_REGION" --wait

      - name: Deploy API service
        run: |
          gcloud run deploy akabbo-api \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$CLOUD_RUN_SA" \
            --set-cloudsql-instances "$SQL_INSTANCE" \
            --set-env-vars "APP_ROLE=api,NODE_ENV=production,LOG_LEVEL=info,AUTH_EXPOSE_OTP=false,LLM_PROVIDER=gemini,STORAGE_PROVIDER=gcs,GCS_BUCKET=akabbo-staging-documents,GCS_SERVICE_ACCOUNT_EMAIL=${CLOUD_RUN_SA},SMS_PROVIDER=ugsms,UGSMS_BASE_URL=https://ugsms.com/api/v2,UGSMS_SENDER_ID=AKABBO,PAYMENT_PROVIDER=muda,MUDA_BASE_URL=https://api.muda.tech/v1,ADMIN_SECRET=wrTEeaXhI3qDSqiKVWmIvcRoEgwIEAp+EL/dHRfEBZ7gAfrQuA4wAEZ/ZXyMgUva" \
            --set-secrets "DATABASE_URL=akabbo-database-url:latest,DIRECT_URL=akabbo-database-url:latest,JWT_SECRET=akabbo-jwt-secret:latest,GEMINI_API_KEY=akabbo-gemini-api-key:latest,UGSMS_API_KEY=akabbo-ugsms-api-key:latest,MUDA_CLIENT_ID=akabbo-muda-client-id:latest,MUDA_CLIENT_SECRET=akabbo-muda-client-secret:latest,MUDA_OAUTH_URL=akabbo-muda-oauth-url:latest,MUDA_WEBHOOK_SECRET=akabbo-muda-webhook-secret:latest,SENTRY_DSN=akabbo-sentry-dsn:latest" \
            --min-instances 0 \
            --max-instances 4 \
            --quiet

      - name: Deploy worker service
        run: |
          gcloud run deploy akabbo-worker \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --no-cpu-throttling \
            --min-instances 1 --max-instances 1 \
            --ingress internal \
            --service-account "$CLOUD_RUN_SA" \
            --set-cloudsql-instances "$SQL_INSTANCE" \
            --set-env-vars "APP_ROLE=worker,NODE_ENV=production,LOG_LEVEL=info,AUTH_EXPOSE_OTP=false,WORKER_HEARTBEAT_MS=15000,LLM_PROVIDER=gemini,STORAGE_PROVIDER=gcs,GCS_BUCKET=akabbo-staging-documents,GCS_SERVICE_ACCOUNT_EMAIL=${CLOUD_RUN_SA},SMS_PROVIDER=ugsms,UGSMS_BASE_URL=https://ugsms.com/api/v2,UGSMS_SENDER_ID=AKABBO,PAYMENT_PROVIDER=muda,MUDA_BASE_URL=https://api.muda.tech/v1,ADMIN_SECRET=wrTEeaXhI3qDSqiKVWmIvcRoEgwIEAp+EL/dHRfEBZ7gAfrQuA4wAEZ/ZXyMgUva" \
            --set-secrets "DATABASE_URL=akabbo-database-url:latest,DIRECT_URL=akabbo-database-url:latest,JWT_SECRET=akabbo-jwt-secret:latest,GEMINI_API_KEY=akabbo-gemini-api-key:latest,UGSMS_API_KEY=akabbo-ugsms-api-key:latest,MUDA_CLIENT_ID=akabbo-muda-client-id:latest,MUDA_CLIENT_SECRET=akabbo-muda-client-secret:latest,MUDA_OAUTH_URL=akabbo-muda-oauth-url:latest,MUDA_WEBHOOK_SECRET=akabbo-muda-webhook-secret:latest,SENTRY_DSN=akabbo-sentry-dsn:latest" \
            --quiet

      - name: Smoke-test API health
        run: |
          URL=$(gcloud run services describe akabbo-api --region "$GCP_REGION" --format='value(status.url)')
          echo "Probing $URL/health"
          curl --fail --retry 5 --retry-delay 3 "$URL/health"
          echo "Probing $URL/health/ready"
          curl --fail --retry 5 --retry-delay 3 "$URL/health/ready"
