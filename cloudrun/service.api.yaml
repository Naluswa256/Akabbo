# Cloud Run service — Akabbo API (staging).
# Apply with: gcloud run services replace cloudrun/service.api.yaml --region=<REGION>
# Cloud SQL connection is via Unix socket (Cloud SQL Auth Proxy built into Cloud Run).
# All sensitive values come from Secret Manager — never inlined here.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: akabbo-api
  labels:
    app: akabbo
    role: api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '20'
        # Cloud SQL Auth Proxy connection (Unix socket — no IP allowlist needed).
        run.googleapis.com/cloudsql-instances: PROJECT_ID:europe-west1:akabbo-staging
    spec:
      serviceAccountName: akabbo-cloudrun@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: europe-west1-docker.pkg.dev/PROJECT_ID/akabbo/akabbo:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: APP_ROLE
              value: api
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: info
            # --- Storage ---
            - name: STORAGE_PROVIDER
              value: gcs
            - name: GCS_BUCKET
              value: akabbo-staging-documents
            - name: GCS_SERVICE_ACCOUNT_EMAIL
              value: akabbo-cloudrun@PROJECT_ID.iam.gserviceaccount.com
            # --- Provider selectors ---
            - name: SMS_PROVIDER
              value: ugsms
            - name: PAYMENT_PROVIDER
              value: muda
            - name: SEARCH_PROVIDER
              value: tavily
            - name: PUBLIC_APP_URL
              value: https://linktrust.app
            - name: EMAIL_PROVIDER
              value: twilio
            # --- UGSMS (SMS) ---
            - name: UGSMS_BASE_URL
              value: https://ugsms.com/api/v2
            - name: UGSMS_SENDER_ID
              value: AKABBO
            # --- Twilio (Email) ---
            # EMAIL_FROM_ADDRESS is deliberately NOT set here: the custom
            # domain (noreply@em9096.linktrust.app) is DNS-authenticated but
            # Twilio still rejects it as a sender (confirmed via direct API
            # testing, 2026-08-03). Left unset, buildEmailProvider derives a
            # working temporary sender from TWILIO_ACCOUNT_SID at runtime
            # (see providers.module.ts) — set this explicitly once Twilio
            # accepts the custom domain (check the Email > Domains console
            # page) to switch back to noreply@em9096.linktrust.app.
            # --- Secrets from Secret Manager ---
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: akabbo-database-url
                  key: latest
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: akabbo-direct-url
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: akabbo-jwt-secret
                  key: latest
            - name: UGSMS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: akabbo-ugsms-api-key
                  key: latest
            - name: SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: akabbo-tavily-api-key
                  key: latest
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: akabbo-twilio-account-sid
                  key: latest
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: akabbo-twilio-auth-token
                  key: latest
            - name: MUDA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: akabbo-muda-client-id
                  key: latest
            - name: MUDA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: akabbo-muda-client-secret
                  key: latest
            - name: MUDA_OAUTH_URL
              valueFrom:
                secretKeyRef:
                  name: akabbo-muda-oauth-url
                  key: latest
            - name: MUDA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: akabbo-muda-base-url
                  key: latest
            - name: MUDA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: akabbo-muda-webhook-secret
                  key: latest
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: akabbo-sentry-dsn
                  key: latest
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 30
